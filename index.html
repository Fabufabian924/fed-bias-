<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1b1b1a;--mu:#6b6a65;--bd:#ddd9cf;--ac:#b8860b;--up:#1a7f4b;--dn:#c0392b;--nu:#8a8a85;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#eeece6;--mu:#9a988f;--bd:#34332f;--ac:#e0b040;--up:#3fbf7f;--dn:#ef6a5a}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#eeece6;--mu:#9a988f;--bd:#34332f;--ac:#e0b040;--up:#3fbf7f;--dn:#ef6a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:14px 0 6px}
.tabs{display:flex;overflow-x:auto;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
.tabs button{flex:1 0 auto;padding:9px 11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:11.5px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;color:#fff;font-weight:600;font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}.nu{color:var(--nu)}
.bgu{background:var(--up)}.bgd{background:var(--dn)}.bgn{background:var(--nu)}
.big{font-size:26px;font-weight:700}.f{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--bd);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:4px;position:relative;margin:6px 0}.bar i{position:absolute;top:0;height:100%;border-radius:4px}.bar b{position:absolute;left:50%;top:-2px;width:2px;height:12px;background:var(--tx)}
.mu{color:var(--mu);font-size:12px}button.r{margin-top:12px;width:100%;padding:9px;border:1px solid var(--bd);background:none;color:var(--mu);border-radius:8px}
.b{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit}.b.s{width:auto;margin:0;padding:4px 14px}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cd{text-align:center;padding:6px 0;border:1px solid var(--bd);border-radius:6px;min-height:46px;font-size:13px}.cd i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:1px}.cd.td{border-color:var(--ac);font-weight:700}.cd.sl{background:var(--bd)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.ch{padding:8px 14px;border:2px solid var(--c);background:none;color:var(--tx);border-radius:99px}.ch.on{background:var(--c);color:#fff}.x{border:0;background:none;color:var(--dn);font-size:16px}

<h1>🥇 Market Bias Precheck</h1>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
<button class="r" onclick="if(confirm('Clear all data?')){S={};save();draw()}">Clear all data</button>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const num=k=>{const v=parseFloat(S[k]);return isNaN(v)?null:v};
let S={};try{S=JSON.parse(localStorage.getItem('bp')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('bp',JSON.stringify(S))}catch(e){}};
let tab='m';
const N=(id,l,ph)=>({id,l,ph});
const SECT={
m:{n:'Monthly',f:[N('cur','Current Fed funds rate, mid (%)','3.75'),N('dot','Dot plot median, year-end (%)','3.25'),N('pdot','Previous dot plot median (%)','3.50'),N('cb','WGC central bank net buying, latest (tonnes)','60'),N('pcb','WGC previous period (tonnes)','45')]},
w:{n:'Weekly',f:[N('ml','COT managed money LONG (this week)'),N('ms','COT managed money SHORT (this week)'),N('pml','COT managed money LONG (last week)'),N('pms','COT managed money SHORT (last week)'),N('ext','Net position percentile, 0-100 (optional)','e.g. 85'),N('cut','FedWatch: cut probability next meeting (%)'),N('hike','FedWatch: hike probability (%)','0'),N('pcut','FedWatch: cut probability last week (%)')]},
d:{n:'Daily',f:[N('co','Candle OPEN'),N('chi','Candle HIGH'),N('clo','Candle LOW'),N('cc','Candle CLOSE (or live price)'),N('pcl','Previous day CLOSE (optional)'),N('pc','Price change today % (auto from candle if blank)'),N('oc','Futures open interest change (%)'),N('px','Current price'),N('lv','Key levels',''),N('re','Reaction at level','')]}};
const REACT=[['','Select...'],[2,'Bullish rejection from support'],[2,'Broke above resistance & held'],[0,'No reaction / chop'],[-2,'Bearish rejection from resistance'],[-2,'Broke below support & held']];
function parseLv(){return (S.lv||'').split('\n').map(l=>{const m=l.match(/-?\d+(\.\d+)?/);return m?{p:parseFloat(m[0]),t:l.replace(m[0],'').trim()}:null}).filter(Boolean)}
function calc(){
const o={m:[],w:[],d:[]};
let c=num('cur'),d=num('dot'),p=num('pdot');
if(c!=null&&d!=null){const cuts=(c-d)/.25;let s=cl(cuts/2,-2,2),t=`${cuts.toFixed(1)} cuts of 25bp projected`;
 if(p!=null){const sh=(p-d)/.25;s=cl(s+cl(sh/2,-1,1),-2,2);t+=sh>0?', dots shifted dovish':sh<0?', dots shifted hawkish':', no shift'}
 o.m.push({n:'Dot plot',s,t})}
let cb=num('cb'),pcb=num('pcb');
if(cb!=null){let s=cb>=50?1.5:cb>=20?1:cb>-20?0:cb>-50?-1:-1.5,t=cb+'t net buying';
 if(pcb!=null){s=cl(s+(cb>pcb?.5:cb<pcb?-.5:0),-2,2);t+=cb>pcb?', accelerating':cb<pcb?', slowing':', unchanged'}
 o.m.push({n:'Central banks',s,t})}
let l=num('ml'),sh=num('ms'),pl=num('pml'),ps=num('pms'),ex=num('ext');
if(l!=null&&sh!=null){const net=l-sh;let s,t='Net '+net.toLocaleString();
 if(pl!=null&&ps!=null){const ch=net-(pl-ps);s=ch>10000?2:ch>0?1:ch<-10000?-2:ch<0?-1:0;t+=`, change ${ch>0?'+':''}${ch.toLocaleString()}`}
 else{s=net>0?1:net<0?-1:0}
 if(ex!=null){if(ex>=90){s-=1;t+=', crowded long (contrarian risk)'}else if(ex<=10){s+=1;t+=', crowded short (squeeze fuel)'}}
 o.w.push({n:'COT',s:cl(s,-2,2),t})}
let cu=num('cut'),hk=num('hike')||0,pc=num('pcut');
if(cu!=null){let s=cl((cu-hk)/50,-2,2),t=`Cut ${cu}% vs hike ${hk}%`;

SECT.w.f=[{t:'h',l:'COT managed money'},N('ml','Managed LONG (this week)'),N('ms','Managed SHORT (this week)'),N('pml','Managed LONG (last week)'),N('pms','Managed SHORT (last week)'),N('coi','COT total open interest (this week)'),N('pcoi','COT total open interest (last week)'),N('ext','Net position percentile, 0-100 (optional)','e.g. 85'),{t:'h',l:'FedWatch: next meeting'},{t:'d',id:'fd',l:'Next meeting date'},N('fe','Ease / cut probability (%)'),N('fn','No change probability (%)'),N('fh','Hike probability (%)','0'),{t:'h',l:'FedWatch: previous meeting (used for trend)'},{t:'d',id:'pfd',l:'Previous meeting date'},N('pfe','Ease / cut probability (%)'),N('pfn','No change probability (%)'),N('pfh','Hike probability (%)'),{t:'h',l:'Previous week candle + OI'},N('pwo','Open'),N('pwh','High'),N('pwl','Low'),N('pwc','Close'),N('pwoi','Open interest')];
SECT.d.f.push({t:'x',id:'alch',l:'Alchemy SNR and reactions (notes, not scored)'});
const inp0=inputs;
inputs=function(k){const h=SECT[k].f.map(f=>{
if(f.t==='h')return `<h2 style="margin:14px 0 0">${f.l}</h2>`;
if(f.t==='d')return `<label>${f.l}</label><input type="date" value="${S[f.id]||''}" onchange="S['${f.id}']=this.value;save();upd()">`;
if(f.t==='x')return `<label>${f.l}</label><textarea rows="3" oninput="S['${f.id}']=this.value;save()">${S[f.id]||''}</textarea>`;
const t=SECT[k].f;SECT[k].f=[f];const r=inp0(k);SECT[k].f=t;return r}).join('');
return h+(k==='w'?`<button class="b" onclick="roll()">Roll week: this week \u2192 last week</button>`:'')};
function roll(){if(!confirm('Move this week values into last week and clear this week?'))return;[['ml','pml'],['ms','pms'],['coi','pcoi']].forEach(([a,b])=>{if(S[a]!==undefined&&S[a]!==''){S[b]=S[a];S[a]=''}});save();draw()}
function sync(){const q=['q1','q2','q3','q4'].map(num).filter(x=>x!=null);
if(q.length){S.cb=q[q.length-1];if(q.length>1)S.pcb=q[q.length-2];else delete S.pcb}
if(num('fe')!=null){S.cut=S.fe;S.hike=S.fh||'0'}if(num('pfe')!=null)S.pcut=S.pfe;
S.ev=S.ev||{};[S.fd,S.pfd].forEach(d=>{if(d){const a=S.ev[d]=S.ev[d]||[];if(!a.includes('FOMC'))a.push('FOMC')}});
const c={...S};delete c.ts;delete c.sg;let h=0;for(const ch of JSON.stringify(c))h=(h*31+ch.charCodeAt(0))|0;if(h!==S.sg){S.sg=h;S.ts=new Date().toLocaleString();save()}}
const calc0=calc;calc=function(){sync();return calc0()};
saveBias=function(){const R=calc(),b=tot3(R);if(b.t==null){alert('Enter some data first');return}S.hist=S.hist||[];S.hist.unshift({k:ymd(new Date()),m:b.m,w:b.w,d:b.d,t:b.t,px:R.px,det:['m','w','d'].map((x,i)=>'MWD'[i]+': '+(R.o[x].map(y=>y.n+' - '+y.t).join('; ')||'-')).join('\n')});S.hist=S.hist.slice(0,60);save();alert('Saved to history')};
draw=function(){$('tabs').innerHTML=[['m','Monthly'],['w','Weekly'],['d','Daily'],['r','Result'],['a','Assistant'],['l','History'],['c','News'],['k','Rules']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';draw()">${x[1]}</button>`).join('');upd(true)};
const upd0=upd;upd=function(f){if(tab==='a'){$('v').innerHTML=asst();return}upd0(f)};
const pch=(a,b)=>a==null||b==null||!b?null:(a-b)/Math.abs(b)*100,f1=v=>v==null?'-':(v>0?'+':'')+v.toFixed(1)+'%',wr=a=>a.length?Math.round(a.filter(x=>x.p>0).length/a.length*100)+'% win':'-';
function asst(){const R=calc(),b=tot3(R),L=num('ml'),Sh=num('ms'),pL=num('pml'),pS=num('pms'),O=num('coi'),pO=num('pcoi'),ext=num('ext'),px=R.px;
const dL=pch(L,pL),dS=pch(Sh,pS),dO=pch(O,pO),net=L!=null&&Sh!=null?L-Sh:null,pn=pL!=null&&pS!=null?pL-pS:null,dn=net!=null&&pn!=null?net-pn:null;
let flow='Enter this week and last week COT plus total open interest.',ctl='-';
if(dn!=null&&dO!=null){const up=dn>0,oiu=dO>0;flow=oiu&&up?'NEW longs entering: new money, healthy rally.':oiu&&!up?'NEW shorts entering: new money, healthy decline.':!oiu&&up?'Short covering: old money leaving shorts, weak rally (OI shrinking).':'Long liquidation: old money leaving longs, weak decline (OI shrinking).';ctl=oiu?(up?'Buyers, with new money':'Sellers, with new money'):'Old money exiting: no new control, move may fade'}
let rev='Enter the percentile (0-100) to monitor COT extremes.';
if(ext!=null){if(ext>=90)rev=dn!=null&&dn<=0?'Extreme long and net buying is stalling: reversal risk DOWN.':'Extreme long (crowded): watch for stalling or longs being sold.';else if(ext<=10)rev=dn!=null&&dn>=0?'Extreme short and net selling is fading: reversal risk UP.':'Extreme short (crowded): watch for a squeeze.';else rev='Not at an extreme ('+ext+'). No peak signal.'}
const dd=R.o.d.find(x=>x.n==='Open interest');
const pcd=(n,h,l,c)=>{const H=num(h),Lw=num(l),C=num(c);if(px==null||H==null||Lw==null)return `<div class="f"><span>${n}</span><span class="nu">enter candle + current price</span></div>`;return `<div class="f"><span>${n}</span><span>${px>H?'Above prior high: bullish break':px<Lw?'Below prior low: bearish break':'Inside prior range'+(C!=null?(px>C?', above prior close':', below prior close'):'')}</span></div>`};
const mac=(n,k)=>{const fc=num(k+'f'),a=num(k+'a');let r='Enter forecast and actual.';if(fc!=null&&a!=null){const d=a-fc;r=d>0?'Hotter than forecast: USD/yields up, gold usually dips first. Do not chase; wait for a level reaction.':d<0?'Softer than forecast: USD/yields down, gold usually bids. Look for longs at support.':'In line: little surprise. Trade your levels.'}
const I=(s,l)=>`<div><label>${l}</label><input type="number" step="any" inputmode="decimal" value="${S[k+s]??''}" onchange="S['${k+s}']=this.value;save();upd()"></div>`;
return `<h2>${n}</h2><div class="card"><div class="row">${I('p','Previous')}${I('f','Forecast')}</div><div class="row">${I('a','Actual')}<div><label>Market reaction (note)</label><input value="${S[k+'r']||''}" onchange="S['${k+'r'}']=this.value;save();upd()"></div></div><p>${r}</p></div>`};
const T=S.tr||[],n=T.length,wb=T.filter(x=>x.bias&&x.dir===x.bias),ab=T.filter(x=>x.bias&&x.dir!==x.bias),viol=T.filter(x=>x.rul==='No'),nw=T.filter(x=>x.nw);
const perf=!n?'Log trades in History to track discipline.':ab.length>wb.length/2?'Too many trades against bias: trade only with the bias.':viol.length?'Rule breaks present: fix discipline before size.':'Disciplined so far: entries match the bias and rules.';
const mi=[],any=ids=>ids.some(i=>num(i)!=null);
if(!any(['q1','q2','q3','q4','cb']))mi.push('WGC central bank buying');if(num('dot')==null)mi.push('Dot plot');if(num('fe')==null)mi.push('FedWatch probabilities');if(L==null||Sh==null)mi.push('COT long/short');if(pL==null||pS==null)mi.push('Last week COT');if(O==null)mi.push('COT open interest');if(num('oc')==null)mi.push('Daily futures OI change');if(!any(['co','chi','clo','cc']))mi.push('Daily candle');if(px==null)mi.push('Current price');if(!parseLv().length)mi.push('Key levels');
const rep=['MARKET BIAS REPORT '+new Date().toLocaleDateString(),'Updated: '+(S.ts||'-'),'Bias: '+lab(b.t)[0]+' (M '+lab(b.m)[0]+', W '+lab(b.w)[0]+', D '+lab(b.d)[0]+')','','MISSING DATA: '+(mi.join(', ')||'none'),'','TRADES WITH BIAS: '+wb.length+' of '+n+' ('+wb.filter(x=>x.al).length+' also monthly+weekly aligned)','TRADES AGAINST BIAS: '+ab.length,'RULES VIOLATED: '+(viol.map(x=>x.k+' '+(x.dir>0?'Long':'Short')+' '+x.en+'->'+x.ex).join('; ')||'none'),'NEWS-DAY TRADES: '+nw.length].join('\n');
return `<div class="mu">Last updated: ${S.ts||'-'}</div><h2>Weekly COT read</h2><div class="card"><div class="f"><span>Managed long</span><b>${f1(dL)}</b></div><div class="f"><span>Managed short</span><b>${f1(dS)}</b></div><div class="f"><span>Open interest</span><b>${f1(dO)}</b></div><div class="f"><span>Net position</span><b>${net==null?'-':net.toLocaleString()}${dn!=null?' ('+(dn>0?'+':'')+dn.toLocaleString()+')':''}</b></div><p><b>${flow}</b></p><div class="f"><span>Who is in control</span><b>${ctl}</b></div><div class="f"><span>Peak / reversal watch</span><span>${rev}</span></div></div><h2>Daily flow</h2><div class="card">${dd?dd.t:'Enter the daily candle and OI change.'}</div><h2>Previous candles</h2><div class="card">${pcd('Previous week','pwh','pwl','pwc')}${pcd('Previous month','mph','mpl','mpc')}</div>${mac('CPI','cpi')}${mac('Jobs report','job')}<h2>Performance and discipline</h2><div class="card"><div class="f"><span>With bias</span><span>${wb.length} (${wr(wb)})</span></div><div class="f"><span>Against bias</span><span>${ab.length} (${wr(ab)})</span></div><div class="f"><span>Rules broken</span><span>${viol.length}</span></div><p><b>${perf}</b></p></div><h2>Past biases (tap for detail)</h2><div class="card">${(S.hist||[]).slice(0,10).map(h=>`<details class="f" style="display:block"><summary>${h.k} \u00b7 M ${ar(h.m)} W ${ar(h.w)} D ${ar(h.d)} \u00b7 ${lab(h.t)[0]}</summary><div class="mu" style="white-space:pre-wrap;margin-top:6px">${h.det||'No details (saved before this update).'}${h.px!=null?'\nPrice: '+h.px:''}</div></details>`).join('')||'<span class="mu">Save a bias from the Result tab.</span>'}</div><h2>Report</h2><div class="card"><textarea id="rep" rows="10" readonly>${rep}</textarea><button class="b" onclick="const t=$('rep');t.select();document.execCommand('copy')">Copy report</button></div>`}
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
